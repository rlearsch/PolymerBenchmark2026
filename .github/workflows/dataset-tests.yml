name: Dataset construction tests

on:
  push:
  pull_request:

jobs:
  every-commit:
    # rdkit==2025.9.6, the checksum-verified descriptor release, currently
    # publishes a CPython 3.12 wheel for macOS ARM but not Ubuntu.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Datasets/Dataset_construction_scripts/requirements.txt
      - name: Install dataset dependencies
        run: python -m pip install -r Datasets/Dataset_construction_scripts/requirements.txt
      - name: Run every-commit tests
        run: bash scripts/test_every_commit.sh
